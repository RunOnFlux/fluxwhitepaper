server {
    # Both ports: 8080 for rootless/local use, and 80 because Flux application
    # specifications commonly map to it. Listening on both means the image works
    # whichever the specification names, instead of returning 503 from the load
    # balancer when the two disagree.
    listen      8080;
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;

    # Emit relative redirects. Without this nginx builds absolute URLs from the
    # listen port, so behind Flux's port mapping every redirect would point at
    # the internal port 8080 and break.
    absolute_redirect off;

    # The main path is the combined document: short paper first, full paper behind it.
    index FluxWhitepaper-Combined.pdf;

    # Serve PDFs inline so a browser opens them instead of downloading. The
    # mime type (application/pdf) comes from nginx's own mime.types.
    location ~* \.pdf$ {
        add_header Content-Disposition "inline"           always;
        add_header Cache-Control       "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff"       always;
    }

    # Short paths, so a link can name what it points at.
    location = /combined   { return 302 /FluxWhitepaper-Combined.pdf; }
    location = /whitepaper { return 302 /FluxWhitepaper-Combined.pdf; }
    location = /full       { return 302 /FluxWhitepaper.pdf; }
    location = /short      { return 302 /FluxWhitepaper-Short.pdf; }

    # Liveness. Kept tiny so a health check never pulls the 3.8 MB PDF.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Anything else goes to the combined document rather than a 404 page.
    location / {
        try_files $uri $uri/ /FluxWhitepaper-Combined.pdf;
    }
}
