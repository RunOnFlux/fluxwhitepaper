name: Publish container

# Builds the image that serves the whitepaper and publishes it to GHCR.
#
# The build is a copy of the committed PDFs into nginx:alpine, so it runs in
# seconds and needs no LaTeX toolchain. Every push to master republishes
# `latest`, which keeps the served document identical to the PDFs in the repo.
# Pushing a `v*` tag additionally publishes an immutable version tag, which is
# what a citation should point at.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=master-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image serves the combined paper
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -1)"
          echo "Testing $IMAGE"
          docker run -d --name verify -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 30); do
            curl -sf --max-time 2 http://127.0.0.1:8080/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/health >/dev/null
          # The root path must return the combined PDF, byte for byte.
          curl -sS http://127.0.0.1:8080/ -o /tmp/served.pdf
          diff <(sha256sum < /tmp/served.pdf) <(sha256sum < FluxWhitepaper-Combined.pdf)
          # ...as application/pdf, so a browser opens it rather than downloading.
          curl -sSI http://127.0.0.1:8080/ | grep -qi 'content-type: application/pdf'
          echo "OK: / serves the combined paper as application/pdf"
          docker rm -f verify
